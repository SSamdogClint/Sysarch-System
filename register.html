<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/w3.css" rel="stylesheet">
    <title>UC - Register</title>

</head>
<body class="w3-animate-opacity"> 
    <nav class="navbar navbar-expand-custom bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-dark">University Of Cebu - Main Campus CCS</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
            <i class="text-dark bi bi-list fs-2 text-dark"></i>
            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                <a class="nav-link text-dark" href="home.html" style="padding-right: 20px;">Home</a>
                </li>

                <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle text-dark" href="#" style="padding-right: 20px;" role="button" data-bs-toggle="dropdown">Community</a>
                </li>

                <li class="nav-item">
                <a class="nav-link text-dark" href="#" style="padding-right: 20px;">About</a>
                </li>

                <li class="nav-item">
                <a class="nav-link text-dark" href="login.html" style="padding-right: 20px;">Sign In</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="row w-100 justify-content-center align-items-center">
            
            <div class="col-12 col-md-4 text-center mb-5 mb-md-0">
                <img src="images/uclogo_nobg.png" class="img-fluid mb-4" alt="University Logo" style="max-height: 220px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));">
                <h2 class="text-white fw-light">Join the <span class="fw-bold">UC Sit-In System</span></h2>
                <p class="text-white-50">Create your student account to get started.</p>
            </div>

            <div class="col-12 col-m-4 col-lg-5" style="margin-top: 30px;">
                <div class="card p-4 p-md-5">
                    <h3 class="text-center mb-4 fw-bold text-dark">Registration</h3>
                    <form id="registerForm">
                        <div class="form-floating mb-3">
                            <input type="studentid" class="form-control bg-light" placeholder="STUDENT ID" name="studentid" required>
                            <label for="studentid">Student ID</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="lastname" class="form-control bg-light" placeholder="LASTNAME" name="lastname" required>
                            <label for="lastname">Last Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="firstname" class="form-control bg-light" placeholder="FIRSTNAME" name="firstname" required>
                            <label for="firstname">First Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="middlename" class="form-control bg-light" placeholder="MIDDLENAME" name="middlename" required>
                            <label for="middlename">Middle Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <select class="form-select bg-light" id="yearlevel" name="yearlvl">
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                            </select>
                            <label for="yearlvl" class="form-label ">Course Level:</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control bg-light" placeholder="EMAIL ADDRESS" name="email" required>
                            <label for="email">Email Address</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control bg-light" placeholder="PASSWORD" name="pswd" required>
                            <label for="pswd">Password</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control bg-light" placeholder="CONFIRM PASSWORD" name="conpswd" required>
                            <label for="conpswd">Confirm Password</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="course" class="form-control bg-light" placeholder="COURSE" name="course" required>
                            <label for="course">Course</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="address" class="form-control bg-light" placeholder="ADDRESS" name="addrs" required>
                            <label for="addrs">Address</label>
                        </div>
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="terms" id="terms" required>
                                <label class="form-check-label small text-muted" for="terms">
                                    I agree to the Terms & Conditions
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-register w-100 shadow-sm">Create Account</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted">Already have an account? <a href="login.html" class="text-decoration-none">Login here</a></p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
