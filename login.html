<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">   
    <link href="css/style.css" rel="stylesheet">
    <link href="css/w3.css" rel="stylesheet">
    <title>UC - Login</title>

</head>
<body class="w3-animate-opacity">
    <nav class="navbar navbar-expand-sm navbar-dark shadow-sm">
        <div class="container">
            <h5 class="text-dark mb-0 university-title">UC Main Campus</h5>
            
            <ul class="navbar-nav ms-auto"> 
                <li class="nav-item dropdown">
                    <a class="text-dark nav-link dropdown-toggle btn btn-outline-light px-3" href="#" id="dropdownToggle" role="button" data-bs-toggle="dropdown">
                        Login
                    </a>
                    <ul class="dropdown-menu shadow border-0 mt-2">
                        <li><a class="dropdown-item" href="login.html">Login</a></li>
                        <li><a class="dropdown-item" href="register.html">Register</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="row w-100 justify-content-center align-items-center">
            
            <div class="col-12 col-md-5 text-center mb-5 mb-md-0">
                <img src="images/uclogo_nobg.png" class="img-fluid mb-4" alt="University Logo" style="max-height: 220px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));">
                <h2 class="text-white fw-light">Welcome to <span class="fw-bold">UC Sit-In Management System</span></h2>
                <p class="text-white-50">Log in to get your sit-in credits.</p>
            </div>

            <div class="col-12 col-md-5 col-lg-4">
                <div class="card p-4 p-md-5">
                    <h3 class="text-center mb-4 fw-bold text-dark">Login</h3>
                    <form action="/action_page.php">
                        <div class="mb-3">
                            <label class="form-label small text-muted">EMAIL ADDRESS</label>
                            <input type="email" class="form-control bg-light" placeholder="email@example.com" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">PASSWORD</label>
                            <input type="password" class="form-control bg-light" placeholder="Enter password" name="pswd" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                                <label class="form-check-label small text-muted" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="small text-decoration-none">Forgot?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 shadow-sm">Sign In</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted">New student? <a href="register.html" class="text-decoration-none fw-bold">Register here</a></p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
