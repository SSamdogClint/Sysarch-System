<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <title>UC - Login</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Same gradient as Register page */
            background: linear-gradient(135deg, #f8f9fa 0%, #002b6b 100%);
            min-height: 100vh;
        }
        .navbar {
            background-color: rgba(13, 110, 253, 0.9) !important;
            backdrop-filter: blur(8px);
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #eee;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
            border-color: #0d6efd;
            background-color: #fff !important;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #0046b8;
            transform: translateY(-2px);
        }
        .university-title {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark shadow-sm">
        <div class="container">
            <h5 class="text-white mb-0 university-title">UC Main Campus</h5>
            
            <ul class="navbar-nav ms-auto"> 
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle btn btn-outline-light px-3" href="#" id="dropdownToggle" role="button" data-bs-toggle="dropdown">
                        Login
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li><a class="dropdown-item" href="login.html">Sign In</a></li>
                        <li><a class="dropdown-item" href="register.html">Create Account</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="row w-100 justify-content-center align-items-center">
            
            <div class="col-12 col-md-5 text-center mb-5 mb-md-0">
                <img src="images/uclogo_nobg.png" class="img-fluid mb-4" alt="University Logo" style="max-height: 220px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));">
                <h2 class="text-white fw-light">Welcome to <span class="fw-bold">UC Sit-In Management System</span></h2>
                <p class="text-white-50">Log in to get your sit-in credits.</p>
            </div>

            <div class="col-12 col-md-5 col-lg-4">
                <div class="card p-4 p-md-5">
                    <h3 class="text-center mb-4 fw-bold text-dark">Login</h3>
                    <form action="/action_page.php">
                        <div class="mb-3">
                            <label class="form-label small text-muted">EMAIL ADDRESS</label>
                            <input type="email" class="form-control bg-light" placeholder="email@example.com" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">PASSWORD</label>
                            <input type="password" class="form-control bg-light" placeholder="Enter password" name="pswd" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                                <label class="form-check-label small text-muted" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="small text-decoration-none">Forgot?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 shadow-sm">Sign In</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted">New student? <a href="register.html" class="text-decoration-none fw-bold">Register here</a></p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
